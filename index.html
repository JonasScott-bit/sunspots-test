<title>Sunspots — test scene 01</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1c4fb8;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Futura","Avenir Next",Avenir,"Trebuchet MS",sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;opacity:.13;mix-blend-mode:overlay;animation:grain .5s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-1%,3%)}100%{transform:translate(3%,-1%)}}

  #titleScr .tw{position:absolute;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(30,20,60,.35))}
  #titleScr .tgrain{position:absolute;inset:-50%;width:200%;height:200%;pointer-events:none;opacity:.16;mix-blend-mode:overlay;animation:grain .5s steps(4) infinite;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #titleScr .thaze{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,220,170,.10) 0%,rgba(0,0,0,0) 55%,rgba(40,15,30,.34) 100%);mix-blend-mode:normal}
  #titleScr .tfoot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 6%);display:flex;flex-direction:column;align-items:center;pointer-events:none}

  /* level 1 HUD */
  #hud{position:fixed;top:calc(env(safe-area-inset-top) + 42px);left:calc(env(safe-area-inset-left) + 14px);max-width:44%;z-index:4;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;color:#fbe9d0;text-shadow:0 2px 0 rgba(60,20,10,.35)}

  #clk.late{color:#ffd0e6;background:rgba(160,30,90,.55);animation:tpulse 1s ease-in-out infinite}
  #clkSub{font-size:9px;letter-spacing:.22em;opacity:.85;margin-top:4px}
  #obj{font-size:11px;letter-spacing:.05em;line-height:1.35;margin-top:6px;opacity:.9}
  #dist{font-size:11px;letter-spacing:.2em;margin-top:2px;opacity:.75}
  body.map #hud,body.map #title,body.map #wildBtn,body.map #hint,body.map #vig,body.map #grain{display:none}
  #getIn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 64px);transform:translateX(-50%);z-index:7;display:none;border:0;border-radius:999px;padding:16px 30px;font:700 18px Futura,Avenir,sans-serif;letter-spacing:.2em;color:#24331f;background:#9fd6b8;box-shadow:0 5px 0 #4f8a6c,0 10px 24px rgba(0,0,0,.25);animation:tpulse 1.4s ease-in-out infinite}
  #drive{display:none}
  body.driving #drive{display:block} body.driving #hint{display:none}
  .dbtn{position:fixed;z-index:7;width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,240,220,.28);color:#fff3dc;font:700 26px Futura,Avenir,sans-serif;box-shadow:inset 0 0 0 2px rgba(255,240,220,.55);-webkit-tap-highlight-color:transparent;touch-action:none}
  .dbtn.on{background:rgba(255,240,220,.6);color:#3a2418}
  #bL{left:calc(env(safe-area-inset-left) + 16px);bottom:calc(env(safe-area-inset-bottom) + 28px)}
  #bR{left:calc(env(safe-area-inset-left) + 104px);bottom:calc(env(safe-area-inset-bottom) + 28px)}
  #bGas{right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 28px);width:84px;height:110px;border-radius:26px;font-size:15px;letter-spacing:.12em;background:rgba(159,214,184,.45)}
  #bBrake{right:calc(env(safe-area-inset-right) + 112px);bottom:calc(env(safe-area-inset-bottom) + 28px);width:74px;height:74px;font-size:13px;letter-spacing:.1em;background:rgba(255,150,150,.35)}
  #bTilt{right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 150px);width:56px;height:34px;border-radius:12px;font-size:11px;letter-spacing:.15em}
  #bVol{left:calc(env(safe-area-inset-left) + 16px);bottom:calc(env(safe-area-inset-bottom) + 118px);width:96px;height:34px;border-radius:12px;font-size:10px;letter-spacing:.12em}
  #bHorn{left:calc(env(safe-area-inset-left) + 16px);bottom:calc(env(safe-area-inset-bottom) + 160px);width:96px;height:34px;border-radius:12px;font-size:10px;letter-spacing:.16em}
  /* sound on/off (remembered). Also on the title screen, where tapping it doesn't start the game */
  #sndBtn{position:fixed;z-index:13;top:calc(env(safe-area-inset-top) + 7px);left:calc(env(safe-area-inset-left) + 14px);width:32px;height:32px;border:0;padding:0;border-radius:50%;background:rgba(43,30,60,.38);color:#fff3dc;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
  #sndBtn svg{position:absolute;left:6px;top:6px;width:20px;height:20px}
  #sndBtn .x{display:none} #sndBtn.off .x{display:inline} #sndBtn.off .w{display:none} #sndBtn.off{background:rgba(120,30,70,.45)}
  body.map #sndBtn{display:none}
  #toast{position:fixed;left:0;right:0;top:44%;text-align:center;z-index:6;color:#fff3dc;font-size:15px;letter-spacing:.12em;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 2px 6px rgba(40,10,30,.6)}
  #endScr{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;color:#fff3dc;background:rgba(43,30,70,.55);backdrop-filter:blur(2px)}
  body.ended #endScr{display:flex} body.ended #drive,body.ended #getIn{display:none!important}
  body.won #endScr{background:rgba(40,110,90,.5)} body.lost #endScr{background:rgba(120,30,70,.55)}
  #endTitle{font-size:38px;font-weight:700;letter-spacing:.16em;text-shadow:0 3px 0 rgba(60,20,10,.4)}
  #endSub{font-size:14px;letter-spacing:.06em;margin:14px 0 26px;max-width:320px;line-height:1.5;opacity:.92}
  #retry{border:0;border-radius:999px;padding:14px 28px;font:700 16px Futura,Avenir,sans-serif;letter-spacing:.2em;color:#2a1a10;background:#e9a62c;box-shadow:0 4px 0 #9b5c16}
  /* first-person eye toggle: press-and-hold 0.5 s (ring fills), quick tap only wiggles */
  #eyeBtn{position:fixed;z-index:7;width:58px;height:58px;border:0;padding:0;border-radius:50%;background:rgba(43,30,60,.38);color:#fff3dc;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    right:calc(env(safe-area-inset-right) + 14px);top:calc(38% - 70px)}
  @media (orientation:landscape){#eyeBtn{top:auto;bottom:calc(env(safe-area-inset-bottom) + 22px);right:calc(env(safe-area-inset-right) + 22px)}}
  #eyeBtn svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #eyeBtn .ring{fill:none;stroke:#f6b23a;stroke-width:4;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:163.4;transform:rotate(-90deg);transform-origin:50% 50%}
  #eyeBtn .track{fill:none;stroke:rgba(255,240,220,.28);stroke-width:4}
  #eyeBtn.fp{background:rgba(246,178,58,.5)}
  #eyeBtn.wig{animation:wig .32s ease-in-out}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg)}75%{transform:rotate(9deg)}}
  body.driving #eyeBtn{top:calc(env(safe-area-inset-top) + 64px);bottom:auto;right:calc(env(safe-area-inset-right) + 12px)} /* in the car: first person <-> chase view, under WILD */
  @media (orientation:landscape){body.driving #eyeBtn{top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 104px)}}
  body.ended #eyeBtn,body.map #eyeBtn{display:none}
  #fpFx{position:fixed;inset:-4%;z-index:3;pointer-events:none;opacity:0;filter:url(#haze);
    background:radial-gradient(ellipse at 50% 50%,rgba(255,120,170,0) 46%,rgba(255,110,170,.22) 68%,rgba(255,80,150,.55) 100%)}
  /* ---- motion scenes (scenes.js): letterbox, subtitles, hold-to-skip, world speech bubbles */
  .lb{position:fixed;left:0;right:0;height:0;background:#1b1324;z-index:8;pointer-events:none;transition:height .55s cubic-bezier(.4,0,.2,1)}
  #lbTop{top:0} #lbBot{bottom:0}
  body.lbox .lb{height:11.5vh} @media (orientation:landscape){body.lbox .lb{height:10vh}}
  body.scene #hud,body.scene #drive,body.scene #eyeBtn,body.scene #wildBtn,body.scene #title,body.scene #getIn,body.scene #toast,body.scene #hint,body.scene #joy{display:none!important}
  #sceneSub{position:fixed;left:50%;bottom:calc(11.5vh + 14px);transform:translate(-50%,8px);z-index:8;width:min(88vw,560px);text-align:center;color:#fff3dc;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
    font-size:clamp(15px,4.3vw,19px);line-height:1.3;letter-spacing:.02em;text-shadow:0 2px 6px rgba(20,8,30,.85),0 0 2px rgba(20,8,30,.9)}
  @media (orientation:landscape){#sceneSub{bottom:calc(10vh + 10px);font-size:clamp(14px,2.2vw,19px)}}
  #sceneSub.on{opacity:1;transform:translate(-50%,0)}
  #sceneSubName{display:block;font-size:.66em;letter-spacing:.24em;font-weight:700;margin-bottom:3px}
  #skipBtn{position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 11.5vh + 10px);right:calc(env(safe-area-inset-right) + 14px);width:58px;height:58px;border:0;padding:0;border-radius:50%;
    background:rgba(43,30,60,.45);color:#fff3dc;font:700 10px/58px Futura,Avenir,sans-serif;letter-spacing:.18em;text-indent:.18em;display:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  @media (orientation:landscape){#skipBtn{top:calc(env(safe-area-inset-top) + 10vh + 8px);right:calc(env(safe-area-inset-right) + 18px);width:50px;height:50px;line-height:50px;font-size:9px}}
  #skipBtn svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #skipBtn .ring{fill:none;stroke:#f6b23a;stroke-width:4;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:163.4;transform:rotate(-90deg);transform-origin:50% 50%}
  #skipBtn .track{fill:none;stroke:rgba(255,240,220,.28);stroke-width:4}
  body.scene #skipBtn{display:block} body.ended #skipBtn{display:none}
  #bubbles{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}

  .sbub b{display:block;font-size:9px;letter-spacing:.22em;filter:brightness(.62) saturate(1.3);margin-bottom:1px}
  .sbub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,243,220,.93)}

  body.ended #bubbles{display:none}
</style>

<body>
<canvas id="c"></canvas>
<div id="grain"></div>
<div id="vig"></div>
<div id="title">LAST MINUTE SNACKS</div>
<button id="wildBtn" aria-label="Toggle Wild Mode">WILD</button>
<button id="eyeBtn" aria-label="Hold to switch first-person view"><svg viewBox="0 0 58 58"><circle class="track" cx="29" cy="29" r="26"/><circle class="ring" cx="29" cy="29" r="26"/>
  <path d="M14 29c4-6 9-9 15-9s11 3 15 9c-4 6-9 9-15 9s-11-3-15-9z" fill="none" stroke="#fff3dc" stroke-width="2.6" stroke-linejoin="round"/><circle cx="29" cy="29" r="4.6" fill="#fff3dc"/></svg></button>
<div id="fpFx"></div>
<svg width="0" height="0" style="position:absolute"><filter id="haze" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence id="hazeT" type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="38" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="hint">DRAG TO WALK · PUSH FAR TO RUN · DRAG THE SKY TO LOOK</div>
<div id="hud"><div id="clk">1:57:30 PM</div><div id="clkSub">STORE CLOSES 2:00 PM</div><div id="obj"></div><div id="dist"></div></div>
<button id="getIn">GET IN</button>
<div id="drive"><button class="dbtn" id="bL">◀</button><button class="dbtn" id="bR">▶</button><button class="dbtn" id="bBrake">BRAKE</button><button class="dbtn" id="bGas">GAS</button><button class="dbtn" id="bTilt">TILT</button><button class="dbtn" id="bVol">RADIO VOL</button><button class="dbtn" id="bHorn">HORN</button></div>
<div id="toast"></div>
<div id="bubbles"></div>
<div class="lb" id="lbTop"></div><div class="lb" id="lbBot"></div>
<div id="sceneSub"><span id="sceneSubName"></span><span id="sceneSubText"></span></div>
<button id="skipBtn" aria-label="Hold to skip the scene"><svg viewBox="0 0 58 58"><circle class="track" cx="29" cy="29" r="26"/><circle class="ring" cx="29" cy="29" r="26"/></svg>SKIP</button>
<div id="endScr"><div id="endTitle"></div><div id="endSub"></div><button id="retry">TRY AGAIN</button></div>
<div class="joy" id="joy"><div class="knob" id="knob"></div></div>
<div id="load"><div class="disc"></div>SUNSPOTS<div id="bar"><i></i></div></div>
<button id="sndBtn" aria-label="Sound on"><svg viewBox="0 0 22 22" fill="none" stroke="#fff3dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l5-4v14l-5-4H3z" fill="#fff3dc"/><g class="w"><path d="M15 8.2a4 4 0 0 1 0 5.6"/><path d="M17.6 5.6a7.6 7.6 0 0 1 0 10.8"/></g><g class="x"><path d="M15 8l5 6M20 8l-5 6"/></g></svg></button>
<div id="titleScr" class="video"><canvas></canvas><img class="tw" src="./title/wordmark.webp" alt="sunspots"><div class="thaze"></div><div class="tgrain"></div><div class="tfoot"><div class="tbar"><i></i></div><div class="ttap">TAP TO START</div></div></div>
<div id="err"></div>
<script>window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent+=String(e.message)+'\n'});</script>
<script type="module" src="./title.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
