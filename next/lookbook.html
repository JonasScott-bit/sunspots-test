<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>Sunspots lookbook — hand-flat v2 (test)</title>
<style>body{margin:0;background:#f3e6d3;font:14px system-ui;color:#3a2a20;overflow:hidden}#c{position:fixed;inset:0}
#ui{position:fixed;left:8px;top:8px;bottom:8px;width:200px;overflow:auto;background:#fff8ee;border-radius:10px;padding:8px;opacity:.94}
#ui b{display:block;margin:8px 0 4px}#ui a{display:block;padding:3px 6px;border-radius:6px;cursor:pointer}#ui a.on{background:#f0a868;color:#fff}
#nm{position:fixed;right:12px;bottom:10px;font-size:18px}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script></head>
<body><canvas id="c"></canvas><div id="ui"></div><div id="nm"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { applySunspotsLook } from './sunspots_material.js';
const M='./models/';
const CAST=[['Wolf','wolf_armsdown_felt.glb','wolf'],['Bear','cast2/bear.glb','bear'],['Crow','scene/crow_armsdown.glb','crow'],['Lynx','cast2/lynx.glb','lynx'],
['Anteater','cast2/anteater.glb','anteater'],['Heron','scene/heron_armsdown.glb','heron'],['Ram','scene/ram.glb','ram'],['Gecko','cast2/gecko.glb','gecko'],
['Moth','moth_driver.glb','moth'],['Banana Squid','cast/wanderer_banana_squid_walking.glb','squid'],['Farmhand','cast/wanderer_shovel_farmhand_walking.glb','farmhand']];
const T2=['argyle_sock','booth_prop','corded_box','eye_chair','fence_stool','mailbox','rubber_glove','stove','washing_machine','window_box','pocket_watch'];
const H2=['house_head','lamp_bulb','lantern','old_tv','phone','plaid_box','pliers','plunger_glasses','roller_skate','sink','toilet','tv_head','wheelbarrow'];
const OBJ=[...T2.map(n=>[n.replace(/_/g,' '),'town2/'+n+'.glb',(n=='argyle_sock'||n=='booth_prop')?'feltobj':'object']),...H2.map(n=>[n.replace(/_/g,' '),'hf2/'+n+'.glb','object'])];
const ALL=[...CAST,...OBJ];
const r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.toneMapping=THREE.NeutralToneMapping;r.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene();sc.background=new THREE.Color(0xf3e6d3);
sc.add(new THREE.HemisphereLight(0xfff1e0,0xd98a6a,1.4));const k=new THREE.DirectionalLight(0xffe2c0,2.2);k.position.set(3,5,4);sc.add(k);
const cam=new THREE.PerspectiveCamera(30,1,0.05,100);cam.position.set(2.2,1.4,4.4);cam.lookAt(0,0.85,0);let yaw=0.5,drag=null;c.onpointerdown=e=>drag=e.clientX;onpointerup=()=>drag=null;onpointermove=e=>{if(drag!==null){yaw+=(e.clientX-drag)*0.01;drag=e.clientX;}};
const ld=new GLTFLoader();ld.setMeshoptDecoder(MeshoptDecoder);let cur=null,mix=null;const piv=new THREE.Group();sc.add(piv);const clk=new THREE.Clock();
function size(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}addEventListener('resize',size);size();
const ui=document.getElementById('ui');const links=[];
[['Main cast',CAST],['New Cast objects (24)',OBJ]].forEach(([h,L])=>{const b=document.createElement('b');b.textContent=h;ui.appendChild(b);
L.forEach(e=>{const a=document.createElement('a');a.textContent=e[0];a.onclick=()=>show(e);ui.appendChild(a);links.push([e,a]);});});
async function show(e){links.forEach(([x,a])=>a.classList.toggle('on',x===e));nm.textContent=e[0]+' — loading';
 const g=await ld.loadAsync(M+e[1]);if(cur)piv.remove(cur);cur=g.scene;
 const bb=new THREE.Box3().setFromObject(cur),s=new THREE.Vector3();bb.getSize(s);const f=1.75/Math.max(s.x,s.y,s.z);cur.scale.setScalar(f);
 bb.setFromObject(cur);const ce=bb.getCenter(new THREE.Vector3());cur.position.x-=ce.x;cur.position.z-=ce.z;cur.position.y-=bb.min.y;
 applySunspotsLook(cur,{mode:'cheap',lite:true,char:e[2],height:1.75});piv.add(cur);
 mix=null;if(g.animations.length){mix=new THREE.AnimationMixer(cur);mix.clipAction(g.animations[0]).play();}
 nm.textContent=e[0];history.replaceState(null,'','?m='+encodeURIComponent(e[1]));window.LB_READY=e[1];}
const q=new URLSearchParams(location.search).get('m');show(ALL.find(e=>e[1]==q)||ALL[0]);
r.setAnimationLoop(()=>{const d=clk.getDelta();if(mix)mix.update(d);if(cur){if(drag===null)yaw+=d*0.3;piv.rotation.y=yaw;}r.render(sc,cam);});
window.LB_ALL=ALL.map(e=>e[1]);
</script></body></html>
